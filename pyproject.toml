[project]
name = "cortexhub"
version = "0.1.0"
description = "Local-first shared memory + Muse scheduling bridge for Claude, on an Obsidian vault"
readme = "README.md"
authors = [
    { name = "PG-1012", email = "panshul.gera@torontomu.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.0",
    "icalendar>=7.3.0",
    "pyperclip>=1.11.0",
    "pyyaml>=6.0.3",
    "recurring-ical-events>=3.8.2",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
cortex = "cortexhub.cli:main"
cortexhub = "cortexhub.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
